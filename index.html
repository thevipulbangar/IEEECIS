<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IEEE CIS | VIT Pune</title>
<meta name="description" content="IEEE CIS (Computational Intelligence Society), VIT Pune. Workshops, hackathons, research and events in AI and computational intelligence.">
<meta name="theme-color" content="#020617">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<!-- Loading screen styles are inline so it shows before any CSS/JS arrives. src/main.jsx dismisses it. -->
<style>
html,body{margin:0;background:#020617}
#loader{position:fixed;inset:0;z-index:100;display:grid;place-content:center;justify-items:center;gap:22px;background:#020617;color:#fff;transition:opacity .5s ease,visibility .5s;animation:loader-timeout 0s 6s forwards}
#loader b{font:900 clamp(40px,10vw,72px)/1 'Archivo',system-ui,sans-serif;font-stretch:125%;letter-spacing:-.01em}
#loader i{position:relative;display:block;width:140px;height:2px;overflow:hidden;border-radius:2px;background:rgba(22,119,255,.24)}
#loader i::after{content:"";position:absolute;inset:0;width:40%;border-radius:2px;background:#22D3EE;animation:loader-bar 1.1s cubic-bezier(.6,0,.4,1) infinite}
html.loaded #loader{opacity:0;visibility:hidden}
@keyframes loader-bar{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
/* Safety net: never keep the page hidden if the app fails to start */
@keyframes loader-timeout{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#loader i::after{animation:none;width:100%;opacity:.6}}
</style>
</head>
<body>
<div id="loader" role="status" aria-label="Loading IEEE CIS"><b>IEEE CIS</b><i></i></div>
<div id="root"></div>

<!-- Hidden copies of the React forms so Netlify detects them at deploy time. Keep field names in sync with Register.jsx / Contact.jsx. -->
<form name="event-registration" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="event"><input name="name"><input name="email"><input name="phone"><input name="year"><input name="branch"><input name="ieee_member">
</form>
<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="name"><input name="email"><textarea name="message"></textarea>
</form>

<script type="module" src="/src/main.jsx"></script>
</body>
</html>
